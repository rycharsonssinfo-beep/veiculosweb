name: Validar painel de veículos
on:
  push:
    branches: [main]
  pull_request:

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Sintaxe
        run: python -m py_compile main.py app.py veiculos_data.py
      - name: Validar JavaScript
        run: node --check assets/interacoes.js
      - name: Verificar recursos visuais
        run: |
          python - <<'PY'
          from pathlib import Path
          for nome in ('logo-painel-dark.png', 'logo-painel-light.png'):
              p = Path('assets') / nome
              imagem = p.read_bytes()
              assert imagem.startswith(b'\x89PNG\r\n\x1a\n'), f'{nome}: não é PNG'
              assert b'tRNS' in imagem or b'RGBA' in imagem, f'{nome}: sem transparência'
              assert len(imagem) > 10000, f'{nome}: arquivo muito pequeno'
          for arquivo in ('assets/painel.css', 'assets/painel_dark.css', 'assets/interacoes.js', 'veiculos_data.py'):
              assert Path(arquivo).is_file(), arquivo
          codigo = Path('main.py').read_text(encoding='utf-8')
          assert 'key="cabecalho_logo"' in codigo
          assert '"logo-painel-dark.png" if TEMA_ESCURO else "logo-painel-light.png"' in codigo
          assert 'st.image(str(logo_path), width=646)' in codigo
          assert '<h1 class="ss-title">Painel de Acessos</h1>' not in codigo
          assert 'Localize a entidade e abra seu ambiente de trabalho.' not in codigo
          assert 'ss-sr-only' in codigo
          assert '<p class="ss-subtitle">Veículos Web</p>' not in codigo
          assert 'Somente com link' not in codigo
          assert 'st.toggle("Agrupar por município"' in codigo
          assert 'Central municipal' not in codigo
          assert 'renderizar_indicadores' not in codigo
          assert 'ss-metrics' not in codigo
          assert 'st.pills(' in codigo
          assert 'Conferência cadastral' in codigo
          estilo = Path('assets/painel.css').read_text(encoding='utf-8')
          assert '.ss-metrics' not in estilo
          assert '.st-key-cabecalho_logo' in estilo
          assert 'object-fit:contain!important' in estilo
          assert 'width:min(100%,646px)!important' in estilo
          assert 'width:min(100%,520px)!important' in estilo
          assert 'max-width:calc(100vw - 2.5rem)!important' in estilo
          assert 'padding:14px 0 6px!important' in estilo
          assert 'margin:0 auto!important' in estilo
          assert 'overflow:visible!important' in estilo
          assert 'horizontal_alignment="center"' in codigo
          assert 'key="filtros_centralizados"' in codigo
          assert 'width="content"' in codigo
          assert 'wrap=True' in codigo
          assert '.st-key-filtros_centralizados' in estilo
          assert '[data-testid="stPills"]' in estilo
          print('Identidade visual e recursos: OK')
          PY
      - name: Verificar destaque de pesquisa e navegação
        run: |
          python - <<'PY'
          import ast
          import unicodedata
          from html import escape
          from pathlib import Path
          codigo=Path('main.py').read_text(encoding='utf-8')
          tree=ast.parse(codigo)
          funcoes=[node for node in tree.body if isinstance(node,ast.FunctionDef) and node.name in ('normalizar','destacar_termo')]
          assert len(funcoes)==2, 'Funções de destaque ausentes'
          contexto={'unicodedata':unicodedata,'escape':escape}
          exec(compile(ast.Module(body=funcoes,type_ignores=[]),'verificacao','exec'),contexto)
          destacar=contexto['destacar_termo']
          assert '<mark class="ss-match">Maranguape</mark>' in destacar('Câmara Municipal de Maranguape','maranguape')
          assert '<mark class="ss-match">Acaraú</mark>' in destacar('Prefeitura de Acaraú','ACARAU')
          assert '<mark' not in destacar('Câmara Municipal de Cruz','Fortaleza')
          assert '&lt;' in destacar('<Câmara>', 'camara')
          assert 'cidade_duplicada' in codigo
          assert 'data-action="back-top"' in codigo
          css=Path('assets/painel.css').read_text(encoding='utf-8')
          js=Path('assets/interacoes.js').read_text(encoding='utf-8')
          assert '.ss-back-top.is-visible' in css
          assert 'prefers-reduced-motion' in css
          assert 'ss-list-enter' in css
          assert '.ss-groups-layout' in css
          assert '.ss-group--size-2' in css
          assert '.ss-group--size-5' in css
          assert 'ss-group--size-' in codigo
          assert "group.classList.toggle('ss-group--size-'" in js
          assert "if(action==='back-top')" in js
          print('Pesquisa e navegação: OK')
          PY
      - name: Verificar ordenação e ajustes de interface
        run: |
          python - <<'PY'
          import ast,unicodedata
          from urllib.parse import urlparse
          from pathlib import Path
          code=Path('main.py').read_text(encoding='utf-8')
          tree=ast.parse(code)
          funcs=[n for n in tree.body if isinstance(n,ast.FunctionDef) and n.name in ('normalizar','ordem_busca','filtrar')]
          assert len(funcs)==3
          ctx={'unicodedata':unicodedata,'urlparse':urlparse}
          exec(compile(ast.Module(body=funcs,type_ignores=[]),'test','exec'),ctx)
          items=[
              dict(nome='Câmara de Caucaia',municipio='Caucaia',categoria='Câmaras',url=''),
              dict(nome='Prefeitura de Acaraú',municipio='Acaraú',categoria='Prefeituras',url=''),
              dict(nome='Câmara de Acaraú',municipio='Acaraú',categoria='Câmaras',url=''),
              dict(nome='Prefeitura de Abaiara',municipio='Abaiara',categoria='Prefeituras',url='')]
          order=[x['nome'] for x in ctx['filtrar'](items)]
          assert order==['Prefeitura de Abaiara','Câmara de Acaraú','Prefeitura de Acaraú','Câmara de Caucaia'],order
          assert ctx['filtrar'](items,'Caucaia')[0]['municipio']=='Caucaia'
          card=next(n for n in tree.body if isinstance(n,ast.FunctionDef) and n.name=='criar_card')
          assert 'Classificação a conferir' not in ast.get_source_segment(code,card)
          assert "'Classificação a conferir'" in code
          style=Path('assets/painel.css').read_text(encoding='utf-8')
          dark=Path('assets/painel_dark.css').read_text(encoding='utf-8')
          javascript=Path('assets/interacoes.js').read_text(encoding='utf-8')
          assert 'stBaseButton-pillsActive' in style
          assert 'st-key-controles_navegacao' in style
          assert 'brightness(1.45)' in dark
          assert "bar.style.display=items.length?'flex':'none'" in javascript
          print('Ordenação e apresentação: OK')
          PY
      - name: Filtros simplificados, preferências e cores
        run: |
          python - <<'PY'
          import ast, unicodedata
          from pathlib import Path
          from urllib.parse import urlparse
          source=Path('main.py').read_text(encoding='utf-8')
          tree=ast.parse(source)
          names=('normalizar','ordem_busca','filtrar')
          funcs=[node for node in tree.body if isinstance(node,ast.FunctionDef) and node.name in names]
          assert len(funcs)==3
          ctx={'unicodedata':unicodedata,'urlparse':urlparse}
          exec(compile(ast.Module(body=funcs,type_ignores=[]),'filters','exec'),ctx)
          data=[
              dict(nome='Câmara de Caucaia',municipio='Caucaia',categoria='Câmaras',url=''),
              dict(nome='Prefeitura de Acaraú',municipio='Acaraú',categoria='Prefeituras',url=''),
              dict(nome='Câmara de Acaraú',municipio='Acaraú',categoria='Câmaras',url=''),
              dict(nome='Ambiente de Treinamento',municipio='Grupo S&S',categoria='Ambientes especiais',url='https://ssveiculos.ssinformatica.net/Treinamento')
          ]
          assert len(ctx['filtrar'](data))==4
          assert len(ctx['filtrar'](data,categoria='Câmaras'))==2
          assert ctx['filtrar'](data,ordenacao='Município')[0]['municipio']=='Acaraú'
          assert ctx['filtrar'](data,ordenacao='Entidade')[0]['nome']=='Ambiente de Treinamento'
          assert ctx['filtrar'](data,ordenacao='Categoria')[0]['categoria']=='Ambientes especiais'
          assert ctx['filtrar'](data,termo='caucaia')[0]['municipio']=='Caucaia'
          assert 'key="ordenacao_atual"' in source
          assert 'key="tipo_ambiente_atual"' not in source
          assert 'def tipo_ambiente' not in source
          assert 'data-type-label' not in source
          assert 'ss-empty--search' in source
          assert 'ss-copy-feedback' in source
          config=Path('.streamlit/config.toml').read_text(encoding='utf-8')
          assert '[theme.light]' in config and '[theme.dark]' in config
          assert 'primaryColor' in config
          javascript=Path('assets/interacoes.js').read_text(encoding='utf-8')
          assert 'localStorage.setItem' in javascript and 'sessionStorage.getItem' in javascript
          assert 'dataset.typeLabel' not in javascript
          assert "showCopyFeedback(control)" in javascript
          assert 'ss-card--favorite' in javascript
          print('Filtros, ordenação, persistência e cores: OK')
          PY
      - name: Verificar acabamento e responsividade
        run: |
          python - <<'PY'
          from pathlib import Path
          source=Path("main.py").read_text(encoding="utf-8")
          style=Path("assets/painel.css").read_text(encoding="utf-8")
          assert '"Ordenar por", ["Município", "Entidade", "Categoria"]' in source
          assert '"Tipo de ambiente"' not in source
          assert 'key="ordenacao_atual", label_visibility="visible"' in source
          assert 'key="tipo_ambiente_atual"' not in source
          assert '.ss-title' in style and 'line-height:1.28' in style
          assert 'padding:5px 0 2px!important' in style
          assert '.ss-fav[aria-pressed="true"]' in style
          assert '[data-testid="stSelectbox"] label' in style
          assert '[data-testid="stHorizontalBlock"]:has(.ss-brand)' in style
          assert '@media (max-width:420px)' in style
          print("Rótulos, título, favoritos e mobile: OK")
          PY
      - name: Consistência cadastral
        run: |
          python - <<'PY'
          import ast
          from collections import Counter
          from pathlib import Path
          from urllib.parse import urlparse
          import unicodedata

          source = Path('veiculos_data.py').read_text(encoding='utf-8')
          tree = ast.parse(source)
          names = {}
          for node in tree.body:
              if isinstance(node, ast.Assign) and len(node.targets) == 1 and isinstance(node.targets[0], ast.Name):
                  if node.targets[0].id in ('ENTIDADES', 'ACESSOS_ADICIONAIS', 'CATEGORIAS'):
                      names[node.targets[0].id] = ast.literal_eval(node.value)
          entidades = names['ENTIDADES']
          adicionais = names['ACESSOS_ADICIONAIS']
          categorias = names['CATEGORIAS']
          assert entidades, 'Cadastro vazio'
          vistos, urls = set(), set()
          for e in entidades + adicionais:
              assert set(('nome','municipio','categoria','url')) <= set(e), e
              assert e['nome'].strip() and e['municipio'].strip(), e
              assert e['categoria'] in categorias, e
              normalizar = lambda s: ''.join(c for c in unicodedata.normalize('NFKD', s) if not unicodedata.combining(c)).casefold()
              identidade = (normalizar(e['nome']), normalizar(e['municipio']), e['categoria'])
              assert identidade not in vistos, f'Entidade duplicada: {e}'
              vistos.add(identidade)
              if e['url']:
                  u = urlparse(e['url'])
                  assert u.scheme=='https' and u.hostname=='ssveiculos.ssinformatica.net' and u.path not in ('','/'), e
                  assert e['url'] not in urls, f'URL duplicada: {e}'
                  urls.add(e['url'])
          assert len(urls) >= 108, f'Esperados pelo menos 108 endereços; encontrados {len(urls)}'
          assert 'https://ssveiculos.ssinformatica.net/IPMparaipaba' in urls
          print(f'OK — {len(entidades)} entidades de origem, {len(adicionais)} acessos adicionais; {len(urls)} URLs únicas')
          PY
