name: Validar painel de veículos
on:
  push:
    branches: [main]
  pull_request:

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Sintaxe
        run: python -m py_compile main.py app.py veiculos_data.py
      - name: Validar JavaScript
        run: node --check assets/interacoes.js
      - name: Verificar recursos visuais
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('assets/veiculosweb.png')
          imagem = p.read_bytes()
          assert imagem.startswith(b'\x89PNG\r\n\x1a\n'), 'Arquivo da logomarca não é PNG'
          assert b'tRNS' in imagem or b'RGBA' in imagem, 'Logomarca deve ter transparência'
          for arquivo in ('assets/painel.css', 'assets/painel_dark.css', 'assets/interacoes.js', 'veiculos_data.py'):
              assert Path(arquivo).is_file(), arquivo
          codigo = Path('main.py').read_text(encoding='utf-8')
          assert '<h1 class="ss-title">Painel de Acessos</h1>' in codigo
          assert '<p class="ss-subtitle">Veículos Web</p>' not in codigo
          assert 'Somente com link' not in codigo
          assert 'st.toggle("Agrupar por município"' in codigo
          assert 'Central municipal' not in codigo
          estilo = Path('assets/painel.css').read_text(encoding='utf-8')
          assert '[data-testid="stPills"]' in estilo
          print('Identidade visual e recursos: OK')
          PY
      - name: Consistência cadastral
        run: |
          python - <<'PY'
          import ast
          from collections import Counter
          from pathlib import Path
          from urllib.parse import urlparse
          import unicodedata

          source = Path('veiculos_data.py').read_text(encoding='utf-8')
          tree = ast.parse(source)
          names = {}
          for node in tree.body:
              if isinstance(node, ast.Assign) and len(node.targets) == 1 and isinstance(node.targets[0], ast.Name):
                  if node.targets[0].id in ('ENTIDADES', 'ACESSOS_ADICIONAIS', 'CATEGORIAS'):
                      names[node.targets[0].id] = ast.literal_eval(node.value)
          entidades = names['ENTIDADES']
          adicionais = names['ACESSOS_ADICIONAIS']
          categorias = names['CATEGORIAS']
          assert entidades, 'Cadastro vazio'
          vistos, urls = set(), set()
          for e in entidades + adicionais:
              assert set(('nome','municipio','categoria','url')) <= set(e), e
              assert e['nome'].strip() and e['municipio'].strip(), e
              assert e['categoria'] in categorias, e
              normalizar = lambda s: ''.join(c for c in unicodedata.normalize('NFKD', s) if not unicodedata.combining(c)).casefold()
              identidade = (normalizar(e['nome']), normalizar(e['municipio']), e['categoria'])
              assert identidade not in vistos, f'Entidade duplicada: {e}'
              vistos.add(identidade)
              if e['url']:
                  u = urlparse(e['url'])
                  assert u.scheme=='https' and u.hostname=='ssveiculos.ssinformatica.net' and u.path not in ('','/'), e
                  assert e['url'] not in urls, f'URL duplicada: {e}'
                  urls.add(e['url'])
          assert len(urls) >= 108, f'Esperados pelo menos 108 endereços; encontrados {len(urls)}'
          assert 'https://ssveiculos.ssinformatica.net/IPMparaipaba' in urls
          print(f'OK — {len(entidades)} entidades de origem, {len(adicionais)} acessos adicionais; {len(urls)} URLs únicas')
          PY
